{% set name = "hazm" %}
{% set version = "0.12.1" %}

package:
  name: "{{ name|lower }}"
  version: "{{ version }}"

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: d8f4b93f3480d3d899362410556c51f60162a7aa4b272a41ad9f4cac1d772542

build:
  noarch: python
  number: 0
  script: "{{ PYTHON }} -m pip install . --no-deps --ignore-installed -vv "

requirements:
  host:
    - pip
    - python {{ python_min }}
    - poetry >=1.8.2,<1.9
  run:
    - nltk >=3.8.1,<4.0.0
    - gensim >=4.3.1,<5.0.0
    - python-crfsuite >=0.9.9,<0.10.0
    - numpy ==1.24.3
    - scikit-learn >=1.2.2,<2.0.0
    - fasttext >=0.9.2,<0.10.0
    - flashtext >=2.7,<3.0
    - poetry >=1.8.2,<1.9
    - python >={{ python_min }},<4.0

test:
  requires:
    - python {{ python_min }}
  imports:
    - hazm

about:
  home: http://www.sobhe.ir/hazm/
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: Python library for digesting Persian text.
  doc_url: https://github.com/sobhe/hazm
  dev_url: https://github.com/sobhe/hazm

extra:
  recipe-maintainers:
    - monaldoj
